[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flextrain"
version = "0.0.1"
description = "Training flexible models with HuggingFace"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Riccardo Zaccone" },
  { name = "Stefanos Laskaridis" },
  { name = "Marco Ciccone" },
  { name = "Samuel Horvath" },
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "flexrank>=0.0.1",
  "accelerate==1.9.0",
  "transformers==4.57.5",
  "hydra-core==1.3.2",
  "datasets==4.2.0",
  "matplotlib==3.10.7",
  "wandb==0.25.1",
  "evaluate==0.4.6",
  "torchvision==0.24.1",
  "scikit-learn==1.6.1",
  "lm_eval==0.4.11"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "build",
  "twine",
  "detect-secrets",
  "wheel",
]

[project.urls]
Homepage = "https://rickzack.github.io/FlexRank/"
Paper = "https://openreview.net/forum?id=DK0kvnNelx"
arXiv = "https://arxiv.org/abs/2602.02680"

[tool.pylint.design]
max-attributes = 35

[tool.pylint.basic]
max-module-lines = 1300

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flextrain = [
  "config/*.yaml",
  "config/*/*.yaml",
]
